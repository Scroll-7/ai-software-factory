name: CI locale — AI Software Factory

# Aucun appel à un modèle externe, aucun secret, aucune donnée réelle.
# Cette CI vérifie uniquement que le code compile et que les tests unitaires passent.
on:
  push:
  pull_request:

jobs:
  api-java:
    name: Compile factory-api (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        working-directory: factory-api
        run: mvn -q -B -DskipTests compile

  rag-python:
    name: Tests rag-service (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests unitaires (sans dépendance externe)
        working-directory: rag-service
        run: python -m unittest discover -s tests -v

  ui-angular:
    name: Build factory-ui (Angular 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: factory-ui/package-lock.json
      - name: Build
        working-directory: factory-ui
        run: npm ci && npm run build
