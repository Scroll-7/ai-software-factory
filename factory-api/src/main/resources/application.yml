spring:
  application:
    name: factory-api

  datasource:
    url: jdbc:postgresql://localhost:5432/pfe_factory
    username: pfe
    password: pfe

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:seed.sql
      # Séparateur `;;` : les blocs DO $$ ... $$ contiennent des `;` internes
      # que le parser Spring ne sait pas ignorer avec le séparateur par défaut.
      separator: ";;"
      continue-on-error: false

  # Propriétés Spring AI 1.0.x vérifiées. Tags vérifiés le 2026-11-18 :
  # qwen2.5-coder:7b = Q4_K_M (4,7 Go) ; bge-m3 = 1024 dimensions, multilingue FR.
  # Le repli 3B est qwen2.5-coder:3b (Q4_K_M, 1,9 Go).
  ai:
    ollama:
      base-url: ${PFE_OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: qwen2.5-coder:7b
          # Le modèle 7B bouclait sur des jetons répétés ("token repeat limit reached").
          # Pénalité de répétition + température faible mais non nulle pour casser la boucle.
          repeat-penalty: 1.15
          repeat-last-n: 64
          temperature: 0.1
      embedding:
        options:
          model: bge-m3

server:
  # 8080 est occupé sur cette machine par l'écouteur Oracle (TNSLSNR).
  # On ne touche pas à Oracle : l'API utilise 8081, configurable par PFE_API_PORT.
  port: ${PFE_API_PORT:8081}

factory:
  prompts:
    version: v1
  github:
    # Secret LOCAL partagé avec le webhook GitHub. Jamais un secret externe, jamais commité en production.
    webhook-secret: ${PFE_GITHUB_WEBHOOK_SECRET:local-dev-only-webhook-secret}
  limits:
    # CODE a droit à 3 tentatives, les autres à 2 (voir Part 2).
    max-attempts:
      SPECS: 2
      DESIGN: 2
      CODE: 3
      TESTS: 3
      REVIEW: 3
    max-repairs-per-run: 4
    llm-timeout-seconds: 120
  scm:
    default-repo: Scroll-7/ai-software-factory
    fake-exposer-repo: Scroll-7/Fake-exposer
  rag:
    base-url: http://localhost:8000
  workspaces:
    dir: ${PFE_WORKSPACES:C:\factory ai\workspaces}
  telemetry:
    enabled: false

security:
  jwt:
    # VERIFY: générer une clé locale aléatoire, ne jamais committer la vraie valeur.
    secret: ${PFE_JWT_SECRET:local-dev-only-key-change-me-0123456789abcdef}
    expiry-seconds: 3600

# Aucun Actuator exporter, aucun service externe, aucune télémétrie.
